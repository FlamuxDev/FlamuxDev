<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="168" viewBox="0 0 1200 168" role="img" aria-label="3 live products, 227+ REST endpoints, 976 pytest files, 13 channels, 185+ agent skills">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120C26"/>
      <stop offset="100%" stop-color="#08060F"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="sep" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="0" y2="134">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
      .n { font-size: 40px; font-weight: 800; letter-spacing: -1px; }
      .l { font-size: 10px; font-weight: 700; letter-spacing: 2.4px; }
      .s { font-size: 8.5px; font-weight: 500; letter-spacing: 1.6px; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="166" rx="18" fill="url(#panel)" stroke="#8B5CF6" stroke-opacity=".28"/>
  <rect x="120" y="1" width="960" height="1.5" fill="url(#topline)"/>

  <g stroke="url(#sep)" stroke-width="1">
    <line x1="240" y1="34" x2="240" y2="134"/>
    <line x1="480" y1="34" x2="480" y2="134"/>
    <line x1="720" y1="34" x2="720" y2="134"/>
    <line x1="960" y1="34" x2="960" y2="134"/>
  </g>

  <!-- 1 · LIVE PRODUCTS -->
  <g class="mono" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".45s" begin="0s" fill="freeze"/>
    <g fill="url(#num)" class="n">
      <text x="120" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.10s"/><set attributeName="opacity" to="0" begin="0.28s"/>1</text>
      <text x="120" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.28s"/><set attributeName="opacity" to="0" begin="0.46s"/>2</text>
      <text x="120" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.46s"/>3</text>
    </g>
    <rect x="75" y="90" width="90" height="3" rx="1.5" fill="#8B5CF6" fill-opacity=".16"/>
    <rect x="75" y="90" width="0" height="3" rx="1.5" fill="url(#bar)"><animate attributeName="width" values="0;90" dur="1.1s" begin="0.2s" fill="freeze"/></rect>
    <text x="120" y="115" class="l" fill="#DDD6FE">LIVE PRODUCTS</text>
    <text x="120" y="131" class="s" fill="#7C74A8">IN PRODUCTION</text>
  </g>

  <!-- 2 · REST ENDPOINTS -->
  <g class="mono" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".45s" begin="0.12s" fill="freeze"/>
    <g fill="url(#num)" class="n">
      <text x="360" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.22s"/><set attributeName="opacity" to="0" begin="0.40s"/>62</text>
      <text x="360" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.40s"/><set attributeName="opacity" to="0" begin="0.58s"/>148</text>
      <text x="360" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.58s"/><set attributeName="opacity" to="0" begin="0.76s"/>209</text>
      <text x="360" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.76s"/>227+</text>
    </g>
    <rect x="315" y="90" width="90" height="3" rx="1.5" fill="#8B5CF6" fill-opacity=".16"/>
    <rect x="315" y="90" width="0" height="3" rx="1.5" fill="url(#bar)"><animate attributeName="width" values="0;90" dur="1.1s" begin="0.32s" fill="freeze"/></rect>
    <text x="360" y="115" class="l" fill="#DDD6FE">REST ENDPOINTS</text>
    <text x="360" y="131" class="s" fill="#7C74A8">ONE PLATFORM</text>
  </g>

  <!-- 3 · PYTEST FILES -->
  <g class="mono" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".45s" begin="0.24s" fill="freeze"/>
    <g fill="url(#num)" class="n">
      <text x="600" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.34s"/><set attributeName="opacity" to="0" begin="0.52s"/>214</text>
      <text x="600" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.52s"/><set attributeName="opacity" to="0" begin="0.70s"/>593</text>
      <text x="600" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.70s"/><set attributeName="opacity" to="0" begin="0.88s"/>871</text>
      <text x="600" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.88s"/>976</text>
    </g>
    <rect x="555" y="90" width="90" height="3" rx="1.5" fill="#8B5CF6" fill-opacity=".16"/>
    <rect x="555" y="90" width="0" height="3" rx="1.5" fill="url(#bar)"><animate attributeName="width" values="0;90" dur="1.1s" begin="0.44s" fill="freeze"/></rect>
    <text x="600" y="115" class="l" fill="#DDD6FE">PYTEST FILES</text>
    <text x="600" y="131" class="s" fill="#7C74A8">HERMETIC SUITE</text>
  </g>

  <!-- 4 · CHANNELS -->
  <g class="mono" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".45s" begin="0.36s" fill="freeze"/>
    <g fill="url(#num)" class="n">
      <text x="840" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.46s"/><set attributeName="opacity" to="0" begin="0.64s"/>5</text>
      <text x="840" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.64s"/><set attributeName="opacity" to="0" begin="0.82s"/>9</text>
      <text x="840" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.82s"/>13</text>
    </g>
    <rect x="795" y="90" width="90" height="3" rx="1.5" fill="#8B5CF6" fill-opacity=".16"/>
    <rect x="795" y="90" width="0" height="3" rx="1.5" fill="url(#bar)"><animate attributeName="width" values="0;90" dur="1.1s" begin="0.56s" fill="freeze"/></rect>
    <text x="840" y="115" class="l" fill="#DDD6FE">CHANNELS</text>
    <text x="840" y="131" class="s" fill="#7C74A8">OMNICHANNEL AI</text>
  </g>

  <!-- 5 · AGENT SKILLS -->
  <g class="mono" text-anchor="middle" opacity="0">
    <animate attributeName="opacity" values="0;1" dur=".45s" begin="0.48s" fill="freeze"/>
    <g fill="url(#num)" class="n">
      <text x="1080" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.58s"/><set attributeName="opacity" to="0" begin="0.76s"/>48</text>
      <text x="1080" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.76s"/><set attributeName="opacity" to="0" begin="0.94s"/>121</text>
      <text x="1080" y="76" opacity="0"><set attributeName="opacity" to="1" begin="0.94s"/>185+</text>
    </g>
    <rect x="1035" y="90" width="90" height="3" rx="1.5" fill="#8B5CF6" fill-opacity=".16"/>
    <rect x="1035" y="90" width="0" height="3" rx="1.5" fill="url(#bar)"><animate attributeName="width" values="0;90" dur="1.1s" begin="0.68s" fill="freeze"/></rect>
    <text x="1080" y="115" class="l" fill="#DDD6FE">AGENT SKILLS</text>
    <text x="1080" y="131" class="s" fill="#7C74A8">SELF-IMPROVING</text>
  </g>

  <text class="mono" x="600" y="154" text-anchor="middle" font-size="8" letter-spacing="3" fill="#4C4470">MEASURED · NOT ESTIMATED</text>
</svg>
