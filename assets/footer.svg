<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 175" font-family="'Helvetica Neue','Segoe UI',Arial,sans-serif">
  <!-- CLOSING — the lines run into the night -->
  <defs>
    <linearGradient id="bands4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151A"/>
      <stop offset="1" stop-color="#0C0E11"/>
    </linearGradient>
    <radialGradient id="lampG4">
      <stop offset="0" stop-color="#5BC98A"/>
      <stop offset="1" stop-color="#5BC98A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="175" fill="url(#bands4)"/>

  <!-- converging rails to a vanishing point -->
  <g stroke="#33383F">
    <line x1="245" y1="175" x2="444" y2="88" stroke-width="5"/>
    <line x1="655" y1="175" x2="456" y2="88" stroke-width="5"/>
  </g>
  <g stroke="#23272D" stroke-width="2">
    <line x1="295" y1="154" x2="605" y2="154"/><line x1="325" y1="142" x2="575" y2="142"/><line x1="353" y1="130" x2="547" y2="130"/><line x1="378" y1="119" x2="522" y2="119"/><line x1="400" y1="110" x2="500" y2="110"/>
  </g>
  <circle cx="450" cy="84" r="12" fill="url(#lampG4)" opacity=".5"><animate attributeName="opacity" values=".55;.15;.55" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="84" r="3" fill="#5BC98A"/>

  <text x="450" y="40" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="5" fill="#ECE8DC">THE LINES NEVER SLEEP</text>
  <text x="450" y="63" text-anchor="middle" font-size="13" fill="#B08D57" font-family="'Segoe UI',Tahoma,Arial,sans-serif">&#1575;&#1604;&#1582;&#1591;&#1608;&#1591; &#1604;&#1575; &#1578;&#1606;&#1575;&#1605;</text>
</svg>
