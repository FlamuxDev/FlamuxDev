<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Abdulrahman Faraj — Full-Stack and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0817"/>
      <stop offset="55%" stop-color="#100A24"/>
      <stop offset="100%" stop-color="#08060F"/>
    </linearGradient>

    <radialGradient id="auV" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auP" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auC" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".65"/>
      <stop offset="70%" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity=".45"/>
    </linearGradient>

    <linearGradient id="shine" x1="-0.6" y1="0" x2="0.4" y2="0">
      <stop offset="0%" stop-color="#7C5CE6"/>
      <stop offset="35%" stop-color="#C4B5FD"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
      <animate attributeName="x1" values="-0.6;1.0;-0.6" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0.4;2.0;0.4" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8B5CF6" stroke-opacity=".18" stroke-width="1"/>
    </pattern>

    <mask id="gridMask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="358" rx="22"/></clipPath>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .mono { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
      .name { font-size: 62px; font-weight: 800; letter-spacing: 7px; }
      .sub  { font-size: 14px; font-weight: 600; letter-spacing: 5.5px; }
      .chip { font-size: 10.5px; font-weight: 700; letter-spacing: 2.2px; }
      .tag  { font-size: 10px; font-weight: 600; letter-spacing: 3px; }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="360" fill="url(#bg)"/>

    <!-- aurora field -->
    <g filter="url(#soft)">
      <ellipse cx="230" cy="120" rx="260" ry="150" fill="url(#auV)">
        <animate attributeName="cx" values="230;350;230" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="120;170;120" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="960" cy="250" rx="280" ry="160" fill="url(#auP)">
        <animate attributeName="cx" values="960;830;960" dur="21s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="250;190;250" dur="17s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="620" cy="330" rx="300" ry="120" fill="url(#auC)">
        <animate attributeName="cy" values="330;280;330" dur="23s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <rect width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>

    <!-- starfield -->
    <g fill="#E9D5FF">
      <circle cx="90" cy="60" r="1.4"><animate attributeName="opacity" values=".1;.9;.1" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="300" r="1.1"><animate attributeName="opacity" values=".8;.15;.8" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="80" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="310" r="1.2"><animate attributeName="opacity" values=".9;.2;.9" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="52" r="1"><animate attributeName="opacity" values=".15;.8;.15" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="760" cy="44" r="1.3"><animate attributeName="opacity" values=".7;.1;.7" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="330" r="1"><animate attributeName="opacity" values=".2;.85;.2" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="336" r="1.1"><animate attributeName="opacity" values=".85;.2;.85" dur="4.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- corner brackets -->
    <g stroke="#8B5CF6" stroke-width="2" fill="none" opacity=".75">
      <path d="M34 78V46h32M1166 78V46h-32M34 282v32h32M1166 282v32h-32"/>
    </g>

    <!-- identity tag -->
    <g opacity=".85">
      <circle cx="452" cy="106" r="3.5" fill="#22D3EE">
        <animate attributeName="opacity" values="1;.15;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text class="mono tag" x="466" y="110" fill="#67E8F9">FLAMUXDEV · AMMAN, JORDAN · UTC+3</text>
    </g>

    <!-- name + glitch layers -->
    <g class="mono name" text-anchor="middle">
      <text x="597" y="192" fill="#22D3EE" opacity="0">ABDULRAHMAN FARAJ
        <animate attributeName="opacity" values="0;0;.55;0;0;.35;0;0" keyTimes="0;0.62;0.635;0.65;0.79;0.8;0.815;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="603" y="192" fill="#EC4899" opacity="0">ABDULRAHMAN FARAJ
        <animate attributeName="opacity" values="0;0;.55;0;0;.35;0;0" keyTimes="0;0.625;0.64;0.655;0.795;0.805;0.82;1" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="600" y="192" fill="url(#shine)" filter="url(#glow)">ABDULRAHMAN FARAJ</text>
    </g>

    <!-- rule + subtitle -->
    <g>
      <rect x="360" y="212" width="480" height="1" fill="#8B5CF6" opacity=".35"/>
      <text class="mono sub" x="600" y="240" text-anchor="middle" fill="#C4B5FD">FULL-STACK &#183; AI AGENT ENGINEER &#183; ARABIC-FIRST SAAS</text>
    </g>

    <!-- chips -->
    <g class="mono chip">
      <g transform="translate(346,266)">
        <rect width="173" height="30" rx="15" fill="#8B5CF6" fill-opacity=".10" stroke="#8B5CF6" stroke-opacity=".55"/>
        <circle cx="18" cy="15" r="4" fill="#34D399"><animate attributeName="r" values="4;5.5;4" dur="2s" repeatCount="indefinite"/></circle>
        <text x="32" y="19" fill="#DDD6FE">3 LIVE PRODUCTS</text>
      </g>
      <g transform="translate(531,266)">
        <rect width="138" height="30" rx="15" fill="#EC4899" fill-opacity=".10" stroke="#EC4899" stroke-opacity=".50"/>
        <text x="18" y="19" fill="#FBCFE8">SHIPPED SOLO</text>
      </g>
      <g transform="translate(681,266)">
        <rect width="173" height="30" rx="15" fill="#22D3EE" fill-opacity=".10" stroke="#22D3EE" stroke-opacity=".45"/>
        <text x="18" y="19" fill="#A5F3FC">MODE: MASTERMIND</text>
      </g>
    </g>

    <!-- scanline sweep -->
    <rect x="0" y="-90" width="1200" height="90" fill="url(#scan)">
      <animate attributeName="y" values="-90;360" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="22" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
