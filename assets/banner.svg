<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Abdulrahman Faraj — AI Agent Engineer">
  <defs>
    <linearGradient id="bBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="60%" stop-color="#070708"/>
      <stop offset="100%" stop-color="#0C0806"/>
    </linearGradient>
    <radialGradient id="bGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#EA580C" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="55%" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0"/>
      <stop offset="12%" stop-color="#F97316" stop-opacity=".5"/>
      <stop offset="88%" stop-color="#F97316" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="hairPulse">
      <stop offset="0%" stop-color="#FFEDD5" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <pattern id="bGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F97316" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <mask id="bGridMask"><rect width="1200" height="300" fill="url(#gridFade)"/></mask>
    <clipPath id="bClip"><rect width="1200" height="300" rx="14"/></clipPath>

    <style>
      .m { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
      .kicker { font-size: 11px; font-weight: 700; letter-spacing: 5.5px; }
      .name   { font-size: 44px; font-weight: 800; letter-spacing: 1.5px; }
      .role   { font-size: 13px; font-weight: 500; letter-spacing: 1.6px; }
      .tag    { font-size: 9.5px; font-weight: 600; letter-spacing: 2.2px; }
      .ring   { font-size: 8.5px; font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>

  <g clip-path="url(#bClip)">
    <rect width="1200" height="300" fill="url(#bBg)"/>
    <ellipse cx="1010" cy="150" rx="330" ry="230" fill="url(#bGlow)"/>
    <rect width="1200" height="300" fill="url(#bGrid)" mask="url(#bGridMask)"/>

    <!-- kicker -->
    <rect x="60" y="101" width="26" height="2" fill="#EA580C"/>
    <text class="m kicker" x="96" y="106" fill="#F97316">AI AGENT ENGINEER</text>

    <!-- name -->
    <text class="m name" x="59" y="164" fill="#FAFAF9">ABDULRAHMAN FARAJ</text>

    <!-- role -->
    <text class="m role" x="61" y="196" fill="#A8A29E">Multi-tenant agent platforms · RAG · tool-loops · production ops</text>

    <!-- tags -->
    <g class="m tag">
      <g transform="translate(60,222)">
        <rect width="152" height="26" rx="4" fill="#F97316" fill-opacity=".07" stroke="#7C2D12"/>
        <text x="14" y="17" fill="#FDBA74">AMMAN · JORDAN</text>
      </g>
      <g transform="translate(222,222)">
        <rect width="150" height="26" rx="4" fill="#F97316" fill-opacity=".07" stroke="#7C2D12"/>
        <text x="14" y="17" fill="#FDBA74">6 AI SYSTEMS</text>
      </g>
      <g transform="translate(382,222)">
        <rect width="186" height="26" rx="4" fill="#F97316" fill-opacity=".07" stroke="#7C2D12"/>
        <circle cx="16" cy="13" r="3.5" fill="#F97316">
          <animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/>
        </circle>
        <text x="30" y="17" fill="#FDBA74">3 IN PRODUCTION</text>
      </g>
    </g>

    <!-- orbit -->
    <g transform="translate(1012,148)">
      <circle r="96" fill="none" stroke="#F97316" stroke-opacity=".10"/>
      <circle r="74" fill="none" stroke="#F97316" stroke-opacity=".16"/>
      <circle r="50" fill="none" stroke="#F97316" stroke-opacity=".10"/>

      <g stroke="#F97316" stroke-opacity=".18" stroke-dasharray="2 6">
        <circle r="120" fill="none">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        </circle>
      </g>

      <!-- six agent nodes on the r=74 ring -->
      <g fill="#0A0A0B" stroke="#EA580C">
        <circle cx="0"   cy="-74" r="5"/>
        <circle cx="64"  cy="-37" r="5"/>
        <circle cx="64"  cy="37"  r="5"/>
        <circle cx="0"   cy="74"  r="5"/>
        <circle cx="-64" cy="37"  r="5"/>
        <circle cx="-64" cy="-37" r="5"/>
      </g>

      <!-- travelling pulse -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
        <circle cx="0" cy="-74" r="4.5" fill="#FB923C"/>
        <circle cx="0" cy="-74" r="11" fill="#F97316" opacity=".22"/>
      </g>

      <!-- core -->
      <rect x="-26" y="-26" width="52" height="52" rx="10" fill="#120A06" stroke="#EA580C" stroke-opacity=".7">
        <animate attributeName="stroke-opacity" values=".7;.25;.7" dur="3.4s" repeatCount="indefinite"/>
      </rect>
      <path d="M0 -11 L11 0 L0 11 L-11 0 Z" fill="#F97316"/>
      <text class="m ring" x="0" y="118" text-anchor="middle" fill="#78716C">AGENT LOOP</text>
    </g>

    <!-- bottom hairline -->
    <rect x="0" y="282" width="1200" height="1" fill="url(#hair)"/>
    <ellipse cx="0" cy="282.5" rx="80" ry="3" fill="url(#hairPulse)">
      <animate attributeName="cx" values="-80;1280" dur="7s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect x=".5" y=".5" width="1199" height="299" rx="14" fill="none" stroke="#1C1917"/>
</svg>
