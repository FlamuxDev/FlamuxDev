<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" font-family="'Helvetica Neue','Segoe UI',Arial,sans-serif">
  <!-- ═══ SIGNAL BOX WORLD · graphite instrument panel, bone track lines,
       signal lamps, engraved brass plates. Assigned direction #3, seed 20415086. ═══ -->
  <defs>
    <linearGradient id="bands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0F12"/>
      <stop offset=".45" stop-color="#12151A"/>
      <stop offset="1" stop-color="#15181E"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CBA96E"/>
      <stop offset=".5" stop-color="#B08D57"/>
      <stop offset="1" stop-color="#96753F"/>
    </linearGradient>
    <radialGradient id="lampG">
      <stop offset="0" stop-color="#5BC98A"/>
      <stop offset="1" stop-color="#5BC98A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="310" fill="url(#bands)"/>
  <rect x="10" y="10" width="880" height="290" fill="none" stroke="#272B32" stroke-width="1.5"/>
  <rect x="15" y="15" width="870" height="280" fill="none" stroke="#1B1E23" stroke-width="1"/>

  <g fill="#20242B" stroke="#343943" stroke-width="1">
    <circle cx="20" cy="20" r="4.5"/><circle cx="880" cy="20" r="4.5"/>
    <circle cx="20" cy="290" r="4.5"/><circle cx="880" cy="290" r="4.5"/>
  </g>
  <g stroke="#4A505C" stroke-width="1.2">
    <line x1="17" y1="20" x2="23" y2="20"/><line x1="877" y1="20" x2="883" y2="20"/>
    <line x1="17" y1="290" x2="23" y2="290"/><line x1="877" y1="290" x2="883" y2="290"/>
  </g>

  <text x="450" y="122" text-anchor="middle" font-size="50" font-weight="700" letter-spacing="8" fill="#ECE8DC">ABDULRAHMAN FARAJ</text>
  <text x="450" y="156" text-anchor="middle" font-size="23" fill="#B08D57" font-family="'Segoe UI',Tahoma,Arial,sans-serif">&#1593;&#1576;&#1583; &#1575;&#1604;&#1585;&#1581;&#1605;&#1606; &#1601;&#1585;&#1580;</text>

  <rect x="272" y="174" width="356" height="38" rx="3" fill="url(#brass)"/>
  <rect x="272" y="174" width="356" height="38" rx="3" fill="none" stroke="#7A5F33" stroke-width="1"/>
  <circle cx="286" cy="193" r="2.4" fill="#171310" opacity=".55"/>
  <circle cx="814" cy="193" r="2.4" fill="#171310" opacity=".55"/>
  <text x="450" y="199" text-anchor="middle" font-size="15.5" font-weight="700" letter-spacing="5.5" fill="#17120B">AI AGENT ENGINEER</text>

  <!-- running lines -->
  <g stroke="#33383F" stroke-width="6">
    <line x1="55" y1="252" x2="845" y2="252"/>
    <line x1="55" y1="274" x2="845" y2="274"/>
  </g>
  <g stroke="#23272D" stroke-width="2">
    <line x1="82" y1="245" x2="82" y2="259"/><line x1="150" y1="245" x2="150" y2="259"/><line x1="218" y1="245" x2="218" y2="259"/><line x1="286" y1="245" x2="286" y2="259"/><line x1="354" y1="245" x2="354" y2="259"/><line x1="422" y1="245" x2="422" y2="259"/><line x1="490" y1="245" x2="490" y2="259"/><line x1="558" y1="245" x2="558" y2="259"/><line x1="626" y1="245" x2="626" y2="259"/><line x1="694" y1="245" x2="694" y2="259"/><line x1="762" y1="245" x2="762" y2="259"/><line x1="830" y1="245" x2="830" y2="259"/>
    <line x1="116" y1="267" x2="116" y2="281"/><line x1="184" y1="267" x2="184" y2="281"/><line x1="252" y1="267" x2="252" y2="281"/><line x1="320" y1="267" x2="320" y2="281"/><line x1="388" y1="267" x2="388" y2="281"/><line x1="456" y1="267" x2="456" y2="281"/><line x1="524" y1="267" x2="524" y2="281"/><line x1="592" y1="267" x2="592" y2="281"/><line x1="660" y1="267" x2="660" y2="281"/><line x1="728" y1="267" x2="728" y2="281"/><line x1="796" y1="267" x2="796" y2="281"/>
  </g>
  <circle r="13" cy="252" fill="url(#lampG)" opacity=".5">
    <animate attributeName="cx" values="62;838" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" cy="252" fill="#5BC98A">
    <animate attributeName="cx" values="62;838" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.2" cy="274" fill="#E8A13C">
    <animate attributeName="cx" values="838;62" dur="7.5s" repeatCount="indefinite"/>
  </circle>

  <g>
    <line x1="36" y1="234" x2="36" y2="292" stroke="#3A3F47" stroke-width="2.5"/>
    <circle cx="36" cy="248" r="5" fill="#14171B" stroke="#3A3F47"/>
    <circle cx="36" cy="264" r="5" fill="#3FA66A"/>
    <circle cx="36" cy="264" r="8" fill="url(#lampG)">
      <animate attributeName="opacity" values=".65;.2;.65" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <line x1="864" y1="234" x2="864" y2="292" stroke="#3A3F47" stroke-width="2.5"/>
    <circle cx="864" cy="248" r="5" fill="#3FA66A"/>
    <circle cx="864" cy="248" r="8" fill="url(#lampG)">
      <animate attributeName="opacity" values=".3;.75;.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="864" cy="264" r="5" fill="#14171B" stroke="#3A3F47"/>
  </g>

  <!-- builder's plate -->
  <text x="34" y="303" font-size="9.5" letter-spacing="3" fill="#7A766B">BUILDER&#8217;S PLATE &#183; FLAMUXDEV</text>
</svg>
