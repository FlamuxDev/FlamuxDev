<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="10" viewBox="0 0 1200 10" role="presentation">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="18%" stop-color="#8B5CF6" stop-opacity=".45"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity=".55"/>
      <stop offset="82%" stop-color="#22D3EE" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="beam">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="35%" stop-color="#C4B5FD" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="4.5" width="1200" height="1" fill="url(#line)"/>

  <ellipse cx="0" cy="5" rx="90" ry="4.5" fill="url(#beam)">
    <animate attributeName="cx" values="-90;1290" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <circle cx="0" cy="5" r="2.2" fill="#FFFFFF">
    <animate attributeName="cx" values="-90;1290" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
