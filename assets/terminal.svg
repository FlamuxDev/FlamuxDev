<svg xmlns="http://www.w3.org/2000/svg" width="620" height="342" viewBox="0 0 620 342" role="img" aria-label="Boot sequence terminal">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0920"/>
      <stop offset="100%" stop-color="#07050E"/>
    </linearGradient>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A1236"/>
      <stop offset="100%" stop-color="#12102A"/>
    </linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="tglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tclip"><rect x="1" y="1" width="618" height="340" rx="14"/></clipPath>
    <style>
      .m { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .t { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, monospace; font-size: 11px; letter-spacing: 1.5px; }
    </style>
  </defs>

  <g clip-path="url(#tclip)">
    <rect width="620" height="342" fill="url(#tbg)"/>
    <rect width="620" height="36" fill="url(#tbar)"/>
    <circle cx="22" cy="18" r="5.5" fill="#FF5F57"/>
    <circle cx="42" cy="18" r="5.5" fill="#FEBC2E"/>
    <circle cx="62" cy="18" r="5.5" fill="#28C840"/>
    <text class="t" x="310" y="22" text-anchor="middle" fill="#6D6494">abd@shadow — /core/boot</text>
    <rect y="36" width="620" height="1" fill="#8B5CF6" fill-opacity=".25"/>

    <g class="m">
      <text x="26" y="72" fill="#C4B5FD" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.030;0.040;0.930;0.960;1" dur="16s" repeatCount="indefinite"/>
        <tspan fill="#EC4899">❯</tspan> ./boot --profile=shadow
      </text>
      <text x="26" y="100" fill="#8F86B8" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.085;0.095;0.930;0.960;1" dur="16s" repeatCount="indefinite"/>
        loading agent orchestrator ....... <tspan fill="#34D399">ok</tspan>
      </text>
      <text x="26" y="128" fill="#8F86B8" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.145;0.155;0.930;0.960;1" dur="16s" repeatCount="indefinite"/>
        mounting rag index (pgvector) .... <tspan fill="#34D399">ok</tspan>
      </text>
      <text x="26" y="156" fill="#8F86B8" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.205;0.215;0.930;0.960;1" dur="16s" repeatCount="indefinite"/>
        warming tool-loop registry ....... <tspan fill="#34D399">ok</tspan>
      </text>
      <text x="26" y="184" fill="#8F86B8" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.265;0.275;0.930;0.960;1" dur="16s" repeatCount="indefinite"/>
        compiling the monorepo ........... <tspan fill="#34D399">ok</tspan>
      </text>
      <text x="26" y="212" fill="#8F86B8" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.320;0.330;0.930;0.960;1" dur="16s" repeatCount="indefinite"/>
        bypassing limitations ............ <tspan fill="#34D399">ok</tspan>
      </text>
    </g>

    <g>
      <rect x="26" y="234" width="440" height="8" rx="4" fill="#8B5CF6" fill-opacity=".14" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.330;0.340;0.930;0.960;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <rect x="26" y="234" width="0" height="8" rx="4" fill="url(#pb)">
        <animate attributeName="width" values="0;0;440;440;0;0" keyTimes="0;0.340;0.430;0.930;0.960;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text class="t" x="480" y="242" fill="#C4B5FD" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.430;0.440;0.930;0.960;1" dur="16s" repeatCount="indefinite"/>
        100%
      </text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.455;0.470;0.930;0.960;1" dur="16s" repeatCount="indefinite"/>
      <text class="m" x="26" y="282" fill="#34D399" filter="url(#tglow)">✔ ACCESS GRANTED</text>
      <text class="t" x="180" y="282" fill="#6D6494">— deploying genius.</text>
    </g>

    <g>
      <text class="m" x="26" y="312" fill="#EC4899">❯</text>
      <rect x="42" y="301" width="9" height="14" fill="#C4B5FD">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="1" y="1" width="618" height="340" rx="14" fill="none" stroke="#8B5CF6" stroke-opacity=".35"/>
</svg>
