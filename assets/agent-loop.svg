<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="284" viewBox="0 0 1200 284" role="img" aria-label="Agent request path: ingress, guard, retrieve, reason, act, verify, stream">
  <defs>
    <linearGradient id="lBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090A"/>
      <stop offset="100%" stop-color="#0B0807"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C2D12" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="dot">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="45%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <style>
      .m  { font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
      .h  { font-size: 12px; font-weight: 700; letter-spacing: 4px; }
      .hs { font-size: 9px; font-weight: 500; letter-spacing: 2px; }
      .ix { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; }
      .st { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
      .dt { font-size: 8px; font-weight: 500; letter-spacing: .4px; }
      .lp { font-size: 9px; font-weight: 600; letter-spacing: 2.5px; }
    </style>
  </defs>

  <rect width="1200" height="284" rx="14" fill="url(#lBg)" stroke="#1C1917"/>

  <text class="m h"  x="46" y="40" fill="#F97316">THE REQUEST PATH I BUILD, HARDEN AND OPERATE</text>
  <text class="m hs" x="1154" y="40" text-anchor="end" fill="#57534E">ONE HOT PATH · SIX SYSTEMS</text>
  <rect x="46" y="54" width="1108" height="1" fill="#1C1917"/>

  <!-- connectors -->
  <g stroke="url(#wire)" stroke-width="1.2">
    <line x1="194" y1="142" x2="206" y2="142"/>
    <line x1="354" y1="142" x2="366" y2="142"/>
    <line x1="514" y1="142" x2="526" y2="142"/>
    <line x1="674" y1="142" x2="686" y2="142"/>
    <line x1="834" y1="142" x2="846" y2="142"/>
    <line x1="994" y1="142" x2="1006" y2="142"/>
  </g>

  <!-- stages -->
  <g class="m">
    <g>
      <rect x="46" y="104" width="148" height="76" rx="8" fill="#100C09" stroke="#292524"/>
      <rect x="46" y="104" width="148" height="76" rx="8" fill="none" stroke="#F97316" stroke-opacity=".15">
        <animate attributeName="stroke-opacity" values=".15;.15;1;.15;.15" keyTimes="0;0.007;0.067;0.127;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text class="ix" x="60" y="124" fill="#57534E">01</text>
      <text class="st" x="60" y="146" fill="#FAFAF9">INGRESS</text>
      <text class="dt" x="60" y="161" fill="#A8A29E">webhook · HMAC</text>
      <text class="dt" x="60" y="172" fill="#78716C">idempotency key</text>
    </g>
    <g>
      <rect x="206" y="104" width="148" height="76" rx="8" fill="#100C09" stroke="#292524"/>
      <rect x="206" y="104" width="148" height="76" rx="8" fill="none" stroke="#F97316" stroke-opacity=".15">
        <animate attributeName="stroke-opacity" values=".15;.15;1;.15;.15" keyTimes="0;0.151;0.211;0.271;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text class="ix" x="220" y="124" fill="#57534E">02</text>
      <text class="st" x="220" y="146" fill="#FAFAF9">GUARD</text>
      <text class="dt" x="220" y="161" fill="#A8A29E">injection corpus</text>
      <text class="dt" x="220" y="172" fill="#78716C">origin allowlist</text>
    </g>
    <g>
      <rect x="366" y="104" width="148" height="76" rx="8" fill="#100C09" stroke="#292524"/>
      <rect x="366" y="104" width="148" height="76" rx="8" fill="none" stroke="#F97316" stroke-opacity=".15">
        <animate attributeName="stroke-opacity" values=".15;.15;1;.15;.15" keyTimes="0;0.296;0.356;0.416;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text class="ix" x="380" y="124" fill="#57534E">03</text>
      <text class="st" x="380" y="146" fill="#FAFAF9">RETRIEVE</text>
      <text class="dt" x="380" y="161" fill="#A8A29E">pgvector · FTS5</text>
      <text class="dt" x="380" y="172" fill="#78716C">RRF hybrid rank</text>
    </g>
    <g>
      <rect x="526" y="104" width="148" height="76" rx="8" fill="#100C09" stroke="#292524"/>
      <rect x="526" y="104" width="148" height="76" rx="8" fill="none" stroke="#F97316" stroke-opacity=".15">
        <animate attributeName="stroke-opacity" values=".15;.15;1;.15;.15" keyTimes="0;0.44;0.5;0.56;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text class="ix" x="540" y="124" fill="#57534E">04</text>
      <text class="st" x="540" y="146" fill="#FAFAF9">REASON</text>
      <text class="dt" x="540" y="161" fill="#A8A29E">bounded tool-loop</text>
      <text class="dt" x="540" y="172" fill="#78716C">token budgets</text>
    </g>
    <g>
      <rect x="686" y="104" width="148" height="76" rx="8" fill="#100C09" stroke="#292524"/>
      <rect x="686" y="104" width="148" height="76" rx="8" fill="none" stroke="#F97316" stroke-opacity=".15">
        <animate attributeName="stroke-opacity" values=".15;.15;1;.15;.15" keyTimes="0;0.584;0.644;0.704;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text class="ix" x="700" y="124" fill="#57534E">05</text>
      <text class="st" x="700" y="146" fill="#FAFAF9">ACT</text>
      <text class="dt" x="700" y="161" fill="#A8A29E">MCP · domain tools</text>
      <text class="dt" x="700" y="172" fill="#78716C">provider failover</text>
    </g>
    <g>
      <rect x="846" y="104" width="148" height="76" rx="8" fill="#100C09" stroke="#292524"/>
      <rect x="846" y="104" width="148" height="76" rx="8" fill="none" stroke="#F97316" stroke-opacity=".15">
        <animate attributeName="stroke-opacity" values=".15;.15;1;.15;.15" keyTimes="0;0.729;0.789;0.849;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text class="ix" x="860" y="124" fill="#57534E">06</text>
      <text class="st" x="860" y="146" fill="#FAFAF9">VERIFY</text>
      <text class="dt" x="860" y="161" fill="#A8A29E">integrity guard</text>
      <text class="dt" x="860" y="172" fill="#78716C">output validators</text>
    </g>
    <g>
      <rect x="1006" y="104" width="148" height="76" rx="8" fill="#100C09" stroke="#292524"/>
      <rect x="1006" y="104" width="148" height="76" rx="8" fill="none" stroke="#F97316" stroke-opacity=".15">
        <animate attributeName="stroke-opacity" values=".15;.15;1;.15;.15" keyTimes="0;0.873;0.933;0.993;1" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text class="ix" x="1020" y="124" fill="#57534E">07</text>
      <text class="st" x="1020" y="146" fill="#FAFAF9">STREAM</text>
      <text class="dt" x="1020" y="161" fill="#A8A29E">Socket.IO · NOTIFY</text>
      <text class="dt" x="1020" y="172" fill="#78716C">token streaming</text>
    </g>
  </g>

  <!-- travelling request -->
  <circle cy="142" r="9" fill="url(#dot)">
    <animate attributeName="cx" values="46;1154" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- feedback loop -->
  <path d="M1080 180 L1080 218 L120 218 L120 180" fill="none" stroke="#7C2D12" stroke-width="1.2" stroke-dasharray="5 7">
    <animate attributeName="stroke-dashoffset" values="0;-96" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M120 186 L115 196 L125 196 Z" fill="#7C2D12"/>
  <rect x="486" y="208" width="228" height="20" rx="4" fill="#09090A"/>
  <text class="m lp" x="600" y="222" text-anchor="middle" fill="#A8A29E">EVAL · MEMORY · REGRESSION</text>

  <text class="m dt" x="46" y="258" fill="#57534E">Every stage above exists in shipped code — not a diagram drawn after the fact.</text>
  <text class="m dt" x="1154" y="258" text-anchor="end" fill="#57534E">mock-first · deterministic tests · golden-query eval</text>
</svg>
